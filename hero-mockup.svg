<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0f2030" />
      <stop offset="1" stop-color="#0b1624" />
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- device frame -->
  <rect x="20" y="20" width="1160" height="660" rx="22" fill="#0b1220" stroke="#1b2a35" stroke-width="2" filter="url(#f1)"/>

  <!-- inner screen -->
  <rect x="60" y="80" width="1080" height="520" rx="12" fill="url(#g1)" />

  <!-- header bar -->
  <rect x="96" y="108" width="200" height="14" rx="7" fill="#233240" opacity="0.8"/>
  <rect x="320" y="104" width="520" height="18" rx="9" fill="#132433"/>

  <!-- mock content blocks -->
  <rect x="96" y="148" width="420" height="22" rx="10" fill="#172938"/>
  <rect x="96" y="186" width="720" height="14" rx="7" fill="#0f2230"/>
  <rect x="96" y="210" width="520" height="18" rx="8" fill="#0f2538"/>
  <rect x="96" y="246" width="320" height="110" rx="8" fill="#091627"/>

  <!-- small chart / graph -->
  <g transform="translate(740,260)">
    <rect x="0" y="0" width="320" height="120" rx="8" fill="#071429"/>
    <polyline points="12,92 48,60 96,72 144,32 192,48 248,28" fill="none" stroke="#3fc6ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>

  <!-- play icon (subtle) -->
  <g transform="translate(560,320)">
    <circle r="36" fill="#0b1e2b" opacity="0.7" stroke="#2b4b66" stroke-width="2"/>
    <polygon points="-6,-10 18,0 -6,10" fill="#58b7ff"/>
  </g>

  <!-- footer knobs -->
  <rect x="96" y="616" width="64" height="8" rx="4" fill="#0f2430" opacity="0.6"/>
  <rect x="176" y="616" width="160" height="8" rx="4" fill="#0f2430" opacity="0.6"/>

</svg>